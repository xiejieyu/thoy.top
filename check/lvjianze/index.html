<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>版权证书详情</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #fbc500;
      --primary-dark: #e0b000;
      --primary-darker: #c99e00;
      --primary-light: #ffd633;
      --primary-bg: #fffbe6;
      --text-dark: #1e293b;
      --text-mid: #475569;
      --text-light: #94a3b8;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --white: #ffffff;
      --shadow: rgba(251, 197, 0, 0.35);
    }

    body {
      background: var(--bg);
      font-family: 'Nunito', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px 12px;
      margin: 0;
      color: var(--text-dark);
    }

    /* 顶部公司门头图片 */
    .banner {
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.15);
      background: var(--white);
      line-height: 0;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .banner img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      max-height: 200px;
    }

    /* 主卡片 */
    .main-card {
      background: var(--white);
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      box-shadow: 0 20px 40px -16px rgba(0, 0, 0, 0.12);
      padding: 28px 22px 24px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      margin-bottom: 20px;
    }

    .card-heading {
      text-align: center;
      margin-bottom: 22px;
    }

    .card-heading h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .card-heading p {
      font-size: 13px;
      color: var(--text-light);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* 表格样式 */
    .cert-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 16px;
      overflow: hidden;
      font-size: 14px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .cert-table tr {
      border-bottom: 1px solid var(--border);
    }

    .cert-table tr:last-child {
      border-bottom: none;
    }

    .cert-table td {
      padding: 13px 16px;
      vertical-align: top;
      line-height: 1.5;
    }

    .cert-table td.label {
      background: #fffbef;
      color: var(--text-mid);
      font-weight: 700;
      width: 38%;
      white-space: nowrap;
      font-size: 13px;
      letter-spacing: 0.2px;
    }

    .cert-table td.value {
      background: var(--white);
      color: var(--text-dark);
      font-weight: 600;
      word-break: break-all;
    }

    /* 证书图片预览区 */
    .preview-section {
      margin-bottom: 22px;
    }

    .preview-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .preview-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background: var(--primary);
      border-radius: 2px;
      display: inline-block;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .preview-item {
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg);
      border: 1.5px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      aspect-ratio: 3 / 4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-item:active {
      transform: scale(0.97);
      border-color: var(--primary);
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preview-item .placeholder-icon {
      width: 40px;
      height: 40px;
      color: var(--text-light);
      opacity: 0.5;
    }

    .preview-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.6));
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 16px 8px 8px;
      text-align: center;
      letter-spacing: 0.3px;
    }

    .preview-item .zoom-hint {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .preview-item .zoom-hint svg {
      width: 14px;
      height: 14px;
      color: var(--text-mid);
    }

    /* 下载区域 */
    .download-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-download {
      width: 100%;
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 16px;
      padding: 17px;
      font-size: 17px;
      font-weight: 800;
      color: var(--text-dark);
      font-family: 'Nunito', sans-serif;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 10px 20px -8px var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-download:active {
      transform: scale(0.97);
      box-shadow: 0 6px 14px -6px var(--shadow);
    }

    .btn-download svg {
      width: 20px;
      height: 20px;
      color: var(--text-dark);
    }

    .format-options {
      display: flex;
      gap: 10px;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease, opacity 0.3s ease;
      opacity: 0;
    }

    .format-options.show {
      max-height: 100px;
      opacity: 1;
      margin-top: 2px;
    }

    .option-btn {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 15px 10px;
      font-size: 15px;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--white);
      color: var(--text-dark);
    }

    .option-btn:active {
      transform: scale(0.97);
    }

    .option-btn.jpg {
      background: #fffbef;
      border-color: var(--primary);
    }

    .option-btn.pdf {
      background: #f1f5f9;
      border-color: var(--border);
    }

    .option-btn svg {
      width: 22px;
      height: 22px;
    }

    .option-btn.jpg svg {
      color: var(--primary-dark);
    }

    .option-btn.pdf svg {
      color: var(--text-mid);
    }

    .option-btn small {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-light);
    }

    .status-message {
      font-size: 13px;
      color: #10b981;
      font-weight: 700;
      text-align: center;
      min-height: 20px;
      transition: opacity 0.3s;
    }

    /* 图片放大查看遮罩 */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .lightbox.show {
      display: flex;
      opacity: 1;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lightbox-close:active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.92);
    }

    .lightbox-close svg {
      width: 22px;
      height: 22px;
      color: white;
    }

    .lightbox-caption {
      position: absolute;
      bottom: 30px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* 底部备案信息 */
    .footer {
      width: 100%;
      max-width: 420px;
      margin-top: 8px;
      text-align: center;
      padding: 0 8px 20px;
    }

    .footer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .footer-row:last-child {
      margin-bottom: 0;
    }

    .footer a {
      color: var(--text-light);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .footer a:hover {
      color: var(--primary-dark);
    }

    .footer img.beian-icon {
      width: 14px;
      height: 14px;
      object-fit: contain;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .footer .copyright {
      font-size: 12px;
      color: var(--text-light);
      font-weight: 500;
      line-height: 1.7;
    }

    @media (max-width: 380px) {
      .main-card {
        padding: 22px 16px;
        border-radius: 24px;
      }
      .card-heading h1 {
        font-size: 20px;
      }
      .banner {
        border-radius: 16px;
      }
      .cert-table td {
        padding: 11px 12px;
        font-size: 13px;
      }
      .cert-table td.label {
        font-size: 12px;
      }
    }
  </style>
</head>

  <script>
    (function() {
      // ============================================================
      // 证书数据配置区
      // 如需增加证书，复制一份 CERTIFICATES 数组中的对象即可。
      // 数组第一个对象为默认展示的证书。
      // ============================================================
      const CERTIFICATES = [
        {
          certNumber: '渝作登字-2026-F-00044014',
          owner: '吕健泽',
          workName: '炽烈',
          category: '美术',
          author: '吕健泽',
          createDate: '2026年7月21日',
          publishDate: '2026年7月21日',
          registerDate: '2026年9月21日',
          // 证书图片地址（主页与样本页）
          mainImage: 'thoy.top/check/lvjianze/渝作26F44014.jpg',
          sampleImage: 'thoy.top/check/lvjianze/渝作26F44014样.jpg',
          // 下载地址
          downloadJpg: [
            'thoy.top/check/lvjianze/渝作26F44014.jpg',
            'thoy.top/check/lvjianze/渝作26F44014样.jpg'
          ],
          downloadPdf: 'thoy.top/check/lvjianze/渝作26F44014.pdf'
        }
        // 如需增加第二个证书，按以下格式复制并修改内容即可：
        // ,
        // {
        //   certNumber: '渝作登字-2026-F-00044015',
        //   owner: '张三',
        //   workName: '示例作品',
        //   category: '摄影',
        //   author: '张三',
        //   createDate: '2026年1月1日',
        //   publishDate: '2026年1月2日',
        //   registerDate: '2026年2月1日',
        //   mainImage: 'thoy.top/check/zhangsan/渝作26F44015.jpg',
        //   sampleImage: 'thoy.top/check/zhangsan/渝作26F44015样.jpg',
        //   downloadJpg: [
        //     'thoy.top/check/zhangsan/渝作26F44015.jpg',
        //     'thoy.top/check/zhangsan/渝作26F44015样.jpg'
        //   ],
        //   downloadPdf: 'thoy.top/check/zhangsan/渝作26F44015.pdf'
        // }
      ];

      // 当前展示的证书（默认第一份）
      const cert = CERTIFICATES[0];

      // DOM 元素
      const downloadBtn = document.getElementById('downloadBtn');
      const formatOptions = document.getElementById('formatOptions');
      const downloadJpgBtn = document.getElementById('downloadJpgBtn');
      const downloadPdfBtn = document.getElementById('downloadPdfBtn');
      const downloadStatus = document.getElementById('downloadStatus');

      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const lightboxCaption = document.getElementById('lightboxCaption');
      const lightboxClose = document.getElementById('lightboxClose');

      // 根据当前证书数据更新页面信息
      function renderCertInfo() {
        const table = document.querySelector('.cert-table');
        table.innerHTML = `
          <tr><td class="label">证书编号</td><td class="value">${cert.certNumber}</td></tr>
          <tr><td class="label">著作权人</td><td class="value">${cert.owner}</td></tr>
          <tr><td class="label">证书作品名</td><td class="value">${cert.workName}</td></tr>
          <tr><td class="label">作品类别</td><td class="value">${cert.category}</td></tr>
          <tr><td class="label">作者</td><td class="value">${cert.author}</td></tr>
          <tr><td class="label">创作完成日期</td><td class="value">${cert.createDate}</td></tr>
          <tr><td class="label">发表日期</td><td class="value">${cert.publishDate}</td></tr>
          <tr><td class="label">登记日期</td><td class="value">${cert.registerDate}</td></tr>
        `;

        // 更新预览图
        const previewItems = document.querySelectorAll('.preview-item');
        if (previewItems[0]) {
          previewItems[0].dataset.src = cert.mainImage;
          previewItems[0].dataset.label = '证书主页';
          const img = previewItems[0].querySelector('img');
          img.src = cert.mainImage;
          img.alt = '证书主页';
          img.style.display = '';
          const placeholder = previewItems[0].querySelector('.placeholder-icon');
          if (placeholder) placeholder.style.display = 'none';
        }
        if (previewItems[1]) {
          previewItems[1].dataset.src = cert.sampleImage;
          previewItems[1].dataset.label = '证书样本页';
          const img = previewItems[1].querySelector('img');
          img.src = cert.sampleImage;
          img.alt = '证书样本页';
          img.style.display = '';
          const placeholder = previewItems[1].querySelector('.placeholder-icon');
          if (placeholder) placeholder.style.display = 'none';
        }
      }

      // 初始化渲染
      renderCertInfo();

      // 下载按钮：展开格式选项
      downloadBtn.addEventListener('click', function() {
        formatOptions.classList.toggle('show');
        downloadStatus.textContent = '';
      });

      // 触发浏览器下载
      function triggerDownload(url, filename) {
        return new Promise((resolve) => {
          const a = document.createElement('a');
          a.href = url;
          a.download = filename || '';
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          resolve();
        });
      }

      // 下载JPG图片（主页 + 样本页）
      downloadJpgBtn.addEventListener('click', async function() {
        try {
          downloadStatus.textContent = '正在下载图片...';
          const files = cert.downloadJpg;
          for (let i = 0; i < files.length; i++) {
            const url = files[i];
            const name = url.split('/').pop();
            await triggerDownload(url, name);
            // 多文件下载间隔，避免被浏览器拦截
            if (i < files.length - 1) {
              await new Promise(r => setTimeout(r, 600));
            }
          }
          downloadStatus.textContent = '✅ JPG 图片下载完成';
          formatOptions.classList.remove('show');
          setTimeout(() => { downloadStatus.textContent = ''; }, 3000);
        } catch (err) {
          downloadStatus.textContent = '❌ 下载失败，请重试';
          setTimeout(() => { downloadStatus.textContent = ''; }, 3000);
        }
      });

      // 下载PDF
      downloadPdfBtn.addEventListener('click', async function() {
        try {
          downloadStatus.textContent = '正在下载PDF...';
          const url = cert.downloadPdf;
          const name = url.split('/').pop();
          await triggerDownload(url, name);
          downloadStatus.textContent = '✅ PDF 文件下载完成';
          formatOptions.classList.remove('show');
          setTimeout(() => { downloadStatus.textContent = ''; }, 3000);
        } catch (err) {
          downloadStatus.textContent = '❌ 下载失败，请重试';
          setTimeout(() => { downloadStatus.textContent = ''; }, 3000);
        }
      });

      // 图片放大预览
      document.querySelectorAll('.preview-item').forEach(item => {
        item.addEventListener('click', function() {
          const src = this.dataset.src;
          const label = this.dataset.label || '证书';
          if (!src) return;
          lightboxImg.src = src;
          lightboxCaption.textContent = label;
          lightbox.classList.add('show');
          document.body.style.overflow = 'hidden';
        });
      });

      // 关闭放大预览
      function closeLightbox() {
        lightbox.classList.remove('show');
        document.body.style.overflow = '';
        setTimeout(() => { lightboxImg.src = ''; }, 300);
      }

      lightboxClose.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', function(e) {
        if (e.target === lightbox) closeLightbox();
      });

      // 按ESC关闭
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && lightbox.classList.contains('show')) {
          closeLightbox();
        }
      });
    })();
  </script>
</body>
</html>
