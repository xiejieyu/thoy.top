<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>版权证书详情</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #fbc500;
      --primary-dark: #e0b000;
      --primary-darker: #c99e00;
      --primary-light: #ffd633;
      --primary-bg: #fffbe6;
      --text-dark: #1e293b;
      --text-mid: #475569;
      --text-light: #94a3b8;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --white: #ffffff;
      --shadow: rgba(251, 197, 0, 0.35);
    }

    body {
      background: var(--bg);
      font-family: 'Nunito', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px 12px;
      margin: 0;
      color: var(--text-dark);
    }

    .banner {
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.15);
      background: var(--white);
      line-height: 0;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .banner img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      max-height: 200px;
    }

    .main-card {
      background: var(--white);
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      box-shadow: 0 20px 40px -16px rgba(0, 0, 0, 0.12);
      padding: 28px 22px 24px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      margin-bottom: 20px;
    }

    .card-heading {
      text-align: center;
      margin-bottom: 22px;
    }

    .card-heading h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .card-heading p {
      font-size: 13px;
      color: var(--text-light);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .cert-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 16px;
      overflow: hidden;
      font-size: 14px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .cert-table tr {
      border-bottom: 1px solid var(--border);
    }

    .cert-table tr:last-child {
      border-bottom: none;
    }

    .cert-table td {
      padding: 13px 16px;
      vertical-align: top;
      line-height: 1.5;
    }

    .cert-table td.label {
      background: #fffbef;
      color: var(--text-mid);
      font-weight: 700;
      width: 38%;
      white-space: nowrap;
      font-size: 13px;
      letter-spacing: 0.2px;
    }

    .cert-table td.value {
      background: var(--white);
      color: var(--text-dark);
      font-weight: 600;
      word-break: break-all;
    }

    .preview-section {
      margin-bottom: 22px;
    }

    .preview-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .preview-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background: var(--primary);
      border-radius: 2px;
      display: inline-block;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .preview-item {
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg);
      border: 1.5px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      aspect-ratio: 3 / 4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-item:active {
      transform: scale(0.97);
      border-color: var(--primary);
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preview-item .placeholder-icon {
      width: 40px;
      height: 40px;
      color: var(--text-light);
      opacity: 0.5;
    }

    .preview-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.6));
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 16px 8px 8px;
      text-align: center;
      letter-spacing: 0.3px;
    }

    .preview-item .zoom-hint {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .preview-item .zoom-hint svg {
      width: 14px;
      height: 14px;
      color: var(--text-mid);
    }

    .download-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-download {
      width: 100%;
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 16px;
      padding: 17px;
      font-size: 17px;
      font-weight: 800;
      color: var(--text-dark);
      font-family: 'Nunito', sans-serif;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 10px 20px -8px var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-download:active {
      transform: scale(0.97);
      box-shadow: 0 6px 14px -6px var(--shadow);
    }

    .btn-download svg {
      width: 20px;
      height: 20px;
      color: var(--text-dark);
    }

    .format-options {
      display: flex;
      gap: 10px;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease, opacity 0.3s ease;
      opacity: 0;
    }

    .format-options.show {
      max-height: 120px;
      opacity: 1;
      margin-top: 2px;
    }

    .option-btn {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 15px 10px;
      font-size: 15px;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--white);
      color: var(--text-dark);
    }

    .option-btn:active {
      transform: scale(0.97);
    }

    .option-btn.jpg {
      background: #fffbef;
      border-color: var(--primary);
    }

    .option-btn.pdf {
      background: #f1f5f9;
      border-color: var(--border);
    }

    .option-btn svg {
      width: 22px;
      height: 22px;
    }

    .option-btn.jpg svg {
      color: var(--primary-dark);
    }

    .option-btn.pdf svg {
      color: var(--text-mid);
    }

    .option-btn small {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-light);
    }

    .status-message {
      font-size: 13px;
      color: #10b981;
      font-weight: 700;
      text-align: center;
      min-height: 20px;
      transition: opacity 0.3s;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .lightbox.show {
      display: flex;
      opacity: 1;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lightbox-close:active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.92);
    }

    .lightbox-close svg {
      width: 22px;
      height: 22px;
      color: white;
    }

    .lightbox-caption {
      position: absolute;
      bottom: 30px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .footer {
      width: 100%;
      max-width: 420px;
      margin-top: 8px;
      text-align: center;
      padding: 0 8px 20px;
    }

    .footer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .footer-row:last-child {
      margin-bottom: 0;
    }

    .footer a {
      color: var(--text-light);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .footer a:hover {
      color: var(--primary-dark);
    }

    .footer img.beian-icon {
      width: 14px;
      height: 14px;
      object-fit: contain;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .footer .copyright {
      font-size: 12px;
      color: var(--text-light);
      font-weight: 500;
      line-height: 1.7;
    }

    @media (max-width: 380px) {
      .main-card {
        padding: 22px 16px;
        border-radius: 24px;
      }
      .card-heading h1 {
        font-size: 20px;
      }
      .banner {
        border-radius: 16px;
      }
      .cert-table td {
        padding: 11px 12px;
        font-size: 13px;
      }
      .cert-table td.label {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="banner">
    <img src="https://thoy.top/check/公司门头.png" alt="公司门头" onerror="this.style.display='none'; this.parentElement.style.display='none';">
  </div>

  <div class="main-card">
    <div class="card-heading">
      <h1>版权证书</h1>
      <p>Copyright Certificate</p>
    </div>

    <table class="cert-table" id="certTable">
      <!-- 由JS动态渲染 -->
    </table>

    <div class="preview-section">
      <div class="preview-title">证书预览</div>
      <div class="preview-grid">
        <div class="preview-item" id="previewMain">
          <img src="" alt="证书主页" id="previewMainImg">
          <div class="zoom-hint">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607zM10.5 7.5v6m3-3h-6" />
            </svg>
          </div>
          <div class="preview-label">证书主页</div>
        </div>

        <div class="preview-item" id="previewSample">
          <img src="" alt="证书样本页" id="previewSampleImg">
          <div class="zoom-hint">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607zM10.5 7.5v6m3-3h-6" />
            </svg>
          </div>
          <div class="preview-label">证书样本页</div>
        </div>
      </div>
    </div>

    <div class="download-section">
      <button class="btn-download" id="downloadBtn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        下载证书
      </button>

      <div class="format-options" id="formatOptions">
        <button class="option-btn jpg" id="downloadJpgBtn">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          图片
          <small>JPG 格式</small>
        </button>
        <button class="option-btn pdf" id="downloadPdfBtn">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 11v6m-3-3h6" />
          </svg>
          PDF
          <small>源文件</small>
        </button>
      </div>

      <div class="status-message" id="downloadStatus"></div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-row">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">
        <img src="../ICP图标" alt="ICP备案图标" class="beian-icon" onerror="this.style.display='none';">
        吉ICP备2026000319-2号
      </a>
    </div>
    <div class="footer-row">
      <a href="http://www.beian.gov.cn/" target="_blank" rel="noopener noreferrer">
        <img src="../备案图标" alt="公网安备图标" class="beian-icon" onerror="this.style.display='none';">
        吉公网安备22032302000082号
      </a>
    </div>
    <div class="footer-row copyright">
      © 2026 炽烈版权 版权所有
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    <img src="" alt="证书大图" id="lightboxImg">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <script>
    (function() {
      // ============================================================
      // 证书数据配置区
      // 增加证书时：复制一个对象追加到数组中即可
      // ============================================================
      const BASE_URL = 'https://thoy.top/check/lvjianze/'; // 文件基础路径，统一管理

      const CERTIFICATES = [
        {
          certNumber: '渝作登字-2026-F-00044014',
          owner: '吕健泽',
          workName: '炽烈',
          category: '美术',
          author: '吕健泽',
          createDate: '2026年7月21日',
          publishDate: '2026年7月21日',
          registerDate: '2026年9月21日',
          // 文件名（不含路径），统一拼接 BASE_URL
          mainImageFile: '渝作26F44014.jpg',
          sampleImageFile: '渝作26F44014样.jpg',
          pdfFile: '渝作26F44014.pdf'
        }
        // 增加第二个证书时，复制以下模板并修改内容：
        // ,
        // {
        //   certNumber: '渝作登字-2026-F-00044015',
        //   owner: '张三',
        //   workName: '示例作品',
        //   category: '摄影',
        //   author: '张三',
        //   createDate: '2026年1月1日',
        //   publishDate: '2026年1月2日',
        //   registerDate: '2026年2月1日',
        //   mainImageFile: '渝作26F44015.jpg',
        //   sampleImageFile: '渝作26F44015样.jpg',
        //   pdfFile: '渝作26F44015.pdf'
        // }
      ];

      const cert = CERTIFICATES[0];

      // 拼接完整URL
      const mainImageUrl = BASE_URL + encodeURIComponent(cert.mainImageFile);
      const sampleImageUrl = BASE_URL + encodeURIComponent(cert.sampleImageFile);
      const pdfUrl = BASE_URL + encodeURIComponent(cert.pdfFile);

      // DOM 元素
      const certTable = document.getElementById('certTable');
      const previewMainImg = document.getElementById('previewMainImg');
      const previewSampleImg = document.getElementById('previewSampleImg');
      const previewMain = document.getElementById('previewMain');
      const previewSample = document.getElementById('previewSample');

      const downloadBtn = document.getElementById('downloadBtn');
      const formatOptions = document.getElementById('formatOptions');
      const downloadJpgBtn = document.getElementById('downloadJpgBtn');
      const downloadPdfBtn = document.getElementById('downloadPdfBtn');
      const downloadStatus = document.getElementById('downloadStatus');

      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const lightboxCaption = document.getElementById('lightboxCaption');
      const lightboxClose = document.getElementById('lightboxClose');

      // 渲染表格
      certTable.innerHTML = `
        <tr><td class="label">证书编号</td><td class="value">${cert.certNumber}</td></tr>
        <tr><td class="label">著作权人</td><td class="value">${cert.owner}</td></tr>
        <tr><td class="label">证书作品名</td><td class="value">${cert.workName}</td></tr>
        <tr><td class="label">作品类别</td><td class="value">${cert.category}</td></tr>
        <tr><td class="label">作者</td><td class="value">${cert.author}</td></tr>
        <tr><td class="label">创作完成日期</td><td class="value">${cert.createDate}</td></tr>
        <tr><td class="label">发表日期</td><td class="value">${cert.publishDate}</td></tr>
        <tr><td class="label">登记日期</td><td class="value">${cert.registerDate}</td></tr>
      `;

      // 设置预览图
      previewMainImg.src = mainImageUrl;
      previewMainImg.alt = '证书主页';
      previewSampleImg.src = sampleImageUrl;
      previewSampleImg.alt = '证书样本页';

      // 预览图点击放大
      previewMain.addEventListener('click', function() {
        lightboxImg.src = mainImageUrl;
        lightboxCaption.textContent = '证书主页';
        lightbox.classList.add('show');
        document.body.style.overflow = 'hidden';
      });

      previewSample.addEventListener('click', function() {
        lightboxImg.src = sampleImageUrl;
        lightboxCaption.textContent = '证书样本页';
        lightbox.classList.add('show');
        document.body.style.overflow = 'hidden';
      });

      // 关闭放大
      function closeLightbox() {
        lightbox.classList.remove('show');
        document.body.style.overflow = '';
        setTimeout(() => { lightboxImg.src = ''; }, 300);
      }

      lightboxClose.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', function(e) {
        if (e.target === lightbox) closeLightbox();
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && lightbox.classList.contains('show')) {
          closeLightbox();
        }
      });

      // 下载按钮：展开/收起格式选项
      downloadBtn.addEventListener('click', function() {
        formatOptions.classList.toggle('show');
        downloadStatus.textContent = '';
      });

      /**
       * 通过 fetch + blob 强制下载文件（解决跨域 download 属性失效的问题）
       * @param {string} url 文件URL
       * @param {string} filename 保存的文件名
       */
      async function downloadFile(url, filename) {
        const response = await fetch(url, {
          method: 'GET',
          mode: 'cors',
          cache: 'no-cache'
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status} - 文件不存在或无法访问`);
        }

        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();

        // 延迟释放
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(blobUrl);
        }, 200);
      }

      // 下载 JPG（主页 + 样本页）
      downloadJpgBtn.addEventListener('click', async function() {
        try {
          downloadStatus.style.color = '#f59e0b';
          downloadStatus.textContent = '正在下载图片...';

          await downloadFile(mainImageUrl, cert.mainImageFile);
          // 稍微延迟，避免浏览器拦截多个下载
          await new Promise(r => setTimeout(r, 800));
          await downloadFile(sampleImageUrl, cert.sampleImageFile);

          downloadStatus.style.color = '#10b981';
          downloadStatus.textContent = '✅ JPG 图片下载完成';
          formatOptions.classList.remove('show');
          setTimeout(() => { downloadStatus.textContent = ''; }, 3000);
        } catch (err) {
          console.error('下载失败:', err);
          downloadStatus.style.color = '#ef4444';
          downloadStatus.textContent = '❌ 下载失败：' + (err.message || '请检查网络或文件路径');
          setTimeout(() => { downloadStatus.textContent = ''; }, 4000);
        }
      });

      // 下载 PDF
      downloadPdfBtn.addEventListener('click', async function() {
        try {
          downloadStatus.style.color = '#f59e0b';
          downloadStatus.textContent = '正在下载PDF...';

          await downloadFile(pdfUrl, cert.pdfFile);

          downloadStatus.style.color = '#10b981';
          downloadStatus.textContent = '✅ PDF 文件下载完成';
          formatOptions.classList.remove('show');
          setTimeout(() => { downloadStatus.textContent = ''; }, 3000);
        } catch (err) {
          console.error('下载失败:', err);
          downloadStatus.style.color = '#ef4444';
          downloadStatus.textContent = '❌ 下载失败：' + (err.message || '请检查网络或文件路径');
          setTimeout(() => { downloadStatus.textContent = ''; }, 4000);
        }
      });
    })();
  </script>
</body>
</html>
