<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>海米尔文化版权证书查询</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #fbc500;
      --primary-dark: #e0b000;
      --primary-darker: #c99e00;
      --primary-light: #ffd633;
      --primary-bg: #fffbe6;
      --text-dark: #1e293b;
      --text-mid: #475569;
      --text-light: #94a3b8;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --white: #ffffff;
      --shadow: rgba(251, 197, 0, 0.35);
    }

    body {
      background: var(--bg);
      font-family: 'Nunito', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 16px 12px;
      margin: 0;
      color: var(--text-dark);
    }

    /* 顶部公司门头图片 */
    .banner {
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.15);
      background: var(--white);
      line-height: 0;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .banner img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      max-height: 200px;
    }

    /* 主卡片 */
    .main-card {
      background: var(--white);
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      box-shadow: 0 20px 40px -16px rgba(0, 0, 0, 0.12);
      padding: 32px 24px 28px;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .card-heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .card-heading h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .card-heading p {
      font-size: 14px;
      color: var(--text-mid);
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-mid);
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: var(--bg);
      border-radius: 16px;
      border: 1.5px solid var(--border);
      transition: all 0.2s;
      padding: 0 16px;
    }

    .input-wrapper:focus-within {
      border-color: var(--primary);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(251, 197, 0, 0.18);
    }

    .input-wrapper.error {
      border-color: #ef4444;
      background: #fef2f2;
    }

    .input-wrapper.error svg {
      color: #ef4444;
    }

    .input-wrapper svg {
      width: 20px;
      height: 20px;
      color: var(--text-light);
      flex-shrink: 0;
      margin-right: 12px;
      transition: color 0.2s;
    }

    input {
      width: 100%;
      border: none;
      background: transparent;
      padding: 15px 0;
      font-size: 16px;
      font-weight: 600;
      outline: none;
      color: var(--text-dark);
      font-family: 'Nunito', sans-serif;
    }

    input::placeholder {
      color: var(--text-light);
      font-weight: 400;
    }

    .field-error {
      display: none;
      font-size: 13px;
      color: #ef4444;
      font-weight: 600;
      margin-top: 6px;
      margin-left: 4px;
    }

    .field-error.show {
      display: block;
    }

    .btn-query {
      width: 100%;
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 16px;
      padding: 17px;
      font-size: 17px;
      font-weight: 800;
      color: var(--text-dark);
      font-family: 'Nunito', sans-serif;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 10px 20px -8px var(--shadow);
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .btn-query:active {
      transform: scale(0.97);
      box-shadow: 0 6px 14px -6px var(--shadow);
    }

    .btn-query svg {
      width: 20px;
      height: 20px;
      color: var(--text-dark);
    }

    .alert {
      background: #fef2f2;
      border-left: 5px solid #ef4444;
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      box-shadow: 0 6px 12px -6px rgba(239, 68, 68, 0.2);
      transition: all 0.3s ease;
    }

    .alert svg {
      width: 22px;
      height: 22px;
      color: #ef4444;
      flex-shrink: 0;
    }

    .alert span {
      font-size: 14px;
      font-weight: 700;
      color: #991b1b;
      line-height: 1.4;
    }

    .hidden {
      display: none !important;
    }

    /* ===== 底部备案信息 —— 优化版本 ===== */
    .footer {
      width: 100%;
      max-width: 420px;
      margin-top: 28px;
      text-align: center;
      padding: 0 8px 8px;
    }

    .footer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px 2px;
      margin-bottom: 6px;
    }

    .footer-row:last-child {
      margin-bottom: 0;
    }

    .footer .beian-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text-light);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      transition: color 0.2s;
      line-height: 1.5;
      padding: 2px 0;
      white-space: nowrap;
    }

    .footer .beian-link:hover {
      color: var(--primary-dark);
    }

    .footer .beian-icon {
      width: 14px;
      height: 14px;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
    }

    .footer .sep {
      color: var(--text-light);
      opacity: 0.45;
      font-size: 12px;
      font-weight: 400;
      margin: 0 2px;
      user-select: none;
    }

    .footer .copyright {
      font-size: 12px;
      color: var(--text-light);
      font-weight: 500;
      line-height: 1.7;
      letter-spacing: 0.2px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
    }

    .footer .copyright span {
      display: inline-block;
    }

    @media (max-width: 400px) {
      .footer .beian-link {
        font-size: 11px;
        gap: 3px;
      }
      .footer .beian-icon {
        width: 12px;
        height: 12px;
      }
      .footer .sep {
        font-size: 11px;
        margin: 0 1px;
      }
      .footer .copyright {
        font-size: 11px;
      }
    }

    @media (max-width: 380px) {
      .main-card {
        padding: 24px 18px;
        border-radius: 24px;
      }
      .card-heading h1 {
        font-size: 20px;
      }
      .banner {
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <!-- 顶部公司门头图片 -->
  <div class="banner">
    <img src="公司门头.png" alt="公司门头" onerror="this.style.display='none'; this.parentElement.style.display='none';">
  </div>

  <!-- 主卡片 -->
  <div id="mainPage" class="main-card main-page">
    <div class="card-heading">
      <h1>版权证书查询</h1>
      <p>输入信息查验您的版权证书</p>
    </div>

    <form id="queryForm" onsubmit="return false;">
      <div class="form-group">
        <label>身份证号</label>
        <div class="input-wrapper" id="idCardWrapper">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.418.835 2.83 2M9 14a3.001 3.001 0 00-2 2M15 11h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <input type="text" id="idCard" placeholder="18位身份证号码" autocomplete="off" inputmode="numeric" maxlength="18">
        </div>
        <div class="field-error" id="idCardError">身份证号必须为18位数字</div>
      </div>

      <div class="form-group">
        <label>联系电话</label>
        <div class="input-wrapper" id="phoneWrapper">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
          </svg>
          <input type="tel" id="phone" placeholder="11位手机号码" autocomplete="off" inputmode="numeric" maxlength="11">
        </div>
        <div class="field-error" id="phoneError">手机号必须为11位数字</div>
      </div>

      <div class="form-group">
        <label>姓名</label>
        <div class="input-wrapper" id="fullNameWrapper">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <input type="text" id="fullName" placeholder="请输入中文姓名" autocomplete="off">
        </div>
        <div class="field-error" id="fullNameError">姓名必须为中文</div>
      </div>

      <button class="btn-query" id="queryBtn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        查询证书
      </button>
    </form>

    <!-- 无证书提示 -->
    <div id="noCertAlert" class="alert hidden">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <span>未查询到对应的版权证书，请核对信息后重试。</span>
    </div>
  </div>

  <!-- ===== 底部备案信息 —— 优化版本 ===== -->
  <footer class="footer">
    <div class="footer-row beian-links">
      <a class="beian-link" href="https://beian.miit.gov.cn/#/Integrated/index" target="_blank" rel="noopener">
        <img src="../ICP.png" alt="ICP备案图标" class="beian-icon"> 吉ICP备2026000319号-2
      </a>
      <span class="sep">|</span>
      <a class="beian-link" href="https://beian.mps.gov.cn/#/query/webSearch?code=22032302000082" target="_blank" rel="noopener">
        <img src="../备案图标.png" alt="公安备案图标" class="beian-icon"> 吉公网安备22032302000082号
      </a>
    </div>
    <div class="footer-row copyright">
      <span>© 2026 吉林海米尔文化传播有限公司 版权所有</span>
    </div>
  </footer>

  <div style="position: fixed; bottom: 12px; right: 20px; opacity: 0.2; pointer-events: none; font-size: 0.8rem;">HMIC</div>

  <script>
    (function() {
      // 默认数据库
      const CERT_DATABASE = [
        {
          idCard: '220323201004162414',
          phone: '15543445525',
          name: '吕健泽',
          certNumber: '渝作登字-2026-F-00044014',
          workName: '炽烈',
          owner: '吕健泽',
          date: '2026-03-15',
        }
      ];

      const queryBtn = document.getElementById('queryBtn');
      const noCertAlert = document.getElementById('noCertAlert');

      const idCardInput = document.getElementById('idCard');
      const phoneInput = document.getElementById('phone');
      const fullNameInput = document.getElementById('fullName');

      const idCardWrapper = document.getElementById('idCardWrapper');
      const phoneWrapper = document.getElementById('phoneWrapper');
      const fullNameWrapper = document.getElementById('fullNameWrapper');

      const idCardError = document.getElementById('idCardError');
      const phoneError = document.getElementById('phoneError');
      const fullNameError = document.getElementById('fullNameError');

      function clearFieldError(wrapper, errorEl) {
        wrapper.classList.remove('error');
        errorEl.classList.remove('show');
      }

      function showFieldError(wrapper, errorEl) {
        wrapper.classList.add('error');
        errorEl.classList.add('show');
      }

      function isValidIdCard(value) {
        return /^\d{18}$/.test(value);
      }

      function isValidPhone(value) {
        return /^\d{11}$/.test(value);
      }

      function isValidChineseName(value) {
        return /^[\u4e00-\u9fa5]{2,10}$/.test(value);
      }

      idCardInput.addEventListener('input', function() {
        clearFieldError(idCardWrapper, idCardError);
        noCertAlert.classList.add('hidden');
      });
      phoneInput.addEventListener('input', function() {
        clearFieldError(phoneWrapper, phoneError);
        noCertAlert.classList.add('hidden');
      });
      fullNameInput.addEventListener('input', function() {
        clearFieldError(fullNameWrapper, fullNameError);
        noCertAlert.classList.add('hidden');
      });

      queryBtn.addEventListener('click', function(e) {
        e.preventDefault();
        noCertAlert.classList.add('hidden');

        const idCard = idCardInput.value.trim();
        const phone = phoneInput.value.trim();
        const fullName = fullNameInput.value.trim();

        let isValid = true;

        if (!isValidIdCard(idCard)) {
          showFieldError(idCardWrapper, idCardError);
          isValid = false;
        } else {
          clearFieldError(idCardWrapper, idCardError);
        }

        if (!isValidPhone(phone)) {
          showFieldError(phoneWrapper, phoneError);
          isValid = false;
        } else {
          clearFieldError(phoneWrapper, phoneError);
        }

        if (!isValidChineseName(fullName)) {
          showFieldError(fullNameWrapper, fullNameError);
          isValid = false;
        } else {
          clearFieldError(fullNameWrapper, fullNameError);
        }

        if (!isValid) return;

        const matched = CERT_DATABASE.find(item =>
          item.idCard === idCard &&
          item.phone === phone &&
          item.name === fullName
        );

        if (matched) {
          alert('信息校验通过，找到证书：' + matched.certNumber + '（跳转功能待接入）');
        } else {
          noCertAlert.classList.remove('hidden');
        }
      });

      clearFieldError(idCardWrapper, idCardError);
      clearFieldError(phoneWrapper, phoneError);
      clearFieldError(fullNameWrapper, fullNameError);
    })();
  </script>
</body>
</html>
